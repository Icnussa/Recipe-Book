<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Book</title>
<meta name="description" content="My personal recipe book: desserts, meals and snacks with cover photos, videos and steps.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipe Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#222225" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-first app shell. Sticky header, recipe card grid, red round add button, fixed bottom tab bar. */
:root {
  --bg: #ffffff;
  --surface: #fbf3f3;
  --surface-2: #f4e6e6;
  --line: #ecdcdc;
  --fg: #2a1f20;
  --muted: #7a6667;
  --red: #ae001e;
  --red-text: #ae001e;
  --red-strong: #8c0018;
  --on-red: #ffffff;
  --red-soft: #fbe2e5;
  --shadow: 0 6px 20px rgba(120, 20, 30, .14);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --tabbar-h: 64px;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #222225; --surface: #2c2c30; --surface-2: #36363b; --line: #3d3d43;
    --fg: #f3eeee; --muted: #aaa1a2; --red: #ae001e; --red-text: #ff5a6e; --red-strong: #c8102e; --on-red: #ffffff;
    --red-soft: #45242a; --shadow: 0 6px 22px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #222225; --surface: #2c2c30; --surface-2: #36363b; --line: #3d3d43;
  --fg: #f3eeee; --muted: #aaa1a2; --red: #ae001e; --red-text: #ff5a6e; --red-strong: #c8102e; --on-red: #ffffff;
  --red-soft: #45242a; --shadow: 0 6px 22px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red-text); outline-offset: 2px; border-radius: 8px; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
}
.top .wrap { padding-block: 14px 10px; display: flex; flex-direction: column; gap: 12px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; flex: none; display: block; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.theme-btn .sun { display: none; }
.is-dark .theme-btn .sun { display: block; }
.is-dark .theme-btn .moon { display: none; }
.search {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; height: 100%; }
.search input::placeholder { color: var(--muted); }

/* Section heading */
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 8px 12px; }
.section-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.015em; text-wrap: balance; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

main { padding-bottom: calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px)); }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  border: 0; padding: 0; text-align: left; background: transparent; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.cover {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: var(--radius); overflow: hidden;
  background: var(--surface-2); background-size: cover; background-position: center;
}
.cover.ph { display: grid; place-items: center; color: var(--red-text); background: var(--red-soft); }
.cover.ph svg { width: 42%; height: 42%; opacity: .9; }
.cover .badge {
  position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff;
}
.cover .play {
  position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--red); color: var(--on-red); display: grid; place-items: center;
}
.cover .play svg { width: 14px; height: 14px; opacity: 1; }
.card-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.card-meta { color: var(--muted); font-size: 12.5px; margin-top: -4px; }

/* Empty state */
.empty { text-align: center; padding: 48px 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .art { width: 84px; height: 84px; border-radius: 26px; background: var(--red-soft); color: var(--red-text); display: grid; place-items: center; }
.empty .art svg { width: 44px; height: 44px; }
.empty h3 { margin: 6px 0 0; color: var(--fg); font-family: var(--font-display); font-size: 20px; }
.empty p { margin: 0; max-width: 30ch; }

/* Add button */
.fab {
  position: fixed; z-index: 20;
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 50%; border: 0;
  background: var(--red); color: var(--on-red); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform .15s ease;
}
.fab:active { transform: scale(.94); }
.fab svg { width: 28px; height: 28px; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-inner { max-width: 760px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(4, 1fr); }
.tab {
  border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--red-text); }
.tab .pill { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
.tab[aria-selected="true"] .pill { background: var(--red-soft); }

/* Sheets (detail + editor) */
.sheet {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  animation: rise .22s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-bar {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
}
.sheet-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-bar h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; flex: 1; text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.primary:disabled { opacity: .6; }
.btn.danger { color: var(--red-text); }
.btn.danger.armed { background: var(--red); color: var(--on-red); border-color: var(--red); }

/* Detail */
.hero { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; background: var(--surface-2); background-size: cover; background-position: center; }
.hero.ph { display: grid; place-items: center; color: var(--red-text); background: var(--red-soft); }
.hero.ph svg { width: 30%; height: 30%; }
.detail { display: flex; flex-direction: column; gap: 18px; }
.detail h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: var(--red-soft); color: var(--red-text); }
.chip.quiet { background: var(--surface); color: var(--muted); }
.block h3 { margin: 0 0 10px; font-family: var(--font-display); font-size: 19px; }
.ingredients { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.ingredients li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.ingredients li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-top: 8px; flex: none; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.steps li::before {
  content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: var(--on-red);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
}
.steps li p { margin: 5px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
video.player { width: 100%; max-width: 100%; border-radius: 18px; background: #000; display: block; max-height: 70vh; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.link-out { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; min-width: 0; }
.link-out .play { width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; flex: none; }
.link-out .play svg { width: 16px; height: 16px; }
.link-out span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-out small { display: block; color: var(--muted); }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px; }

/* Editor */
.form { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.label em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; }
.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; outline: none; font-size: 16px;
}
.input:focus { border-color: var(--red); }
textarea.input { resize: vertical; min-height: 96px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; height: 40px; border-radius: 10px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.picker {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 18px; border: 2px dashed var(--line); background: var(--surface);
  background-size: cover; background-position: center; display: grid; place-items: center; color: var(--muted); text-align: center; overflow: hidden;
}
.picker.has { border-style: solid; border-color: transparent; }
.picker .inner { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; }
.picker .inner svg { width: 30px; height: 30px; color: var(--red-text); }
.picker.has .inner { display: none; }
.picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
.file-label { position: relative; overflow: hidden; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.step-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 36px; gap: 8px; align-items: start; }
.step-num { width: 30px; height: 30px; margin-top: 9px; border-radius: 50%; background: var(--red); color: var(--on-red); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.step-row textarea.input { min-height: 52px; }
.step-x { width: 36px; height: 36px; margin-top: 6px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.step-x svg { width: 18px; height: 18px; }
.steps-edit { display: flex; flex-direction: column; gap: 10px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.err { color: var(--red-text); font-size: 13px; font-weight: 600; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow);
  max-width: calc(100% - 32px); text-align: center;
}
.storage-note { font-size: 12px; color: var(--muted); text-align: center; padding-block: 28px 0; }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .fab, .tab .pill { transition: none; }
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <img class="brand-mark" src="icons/icon-192.png" alt="" width="34" height="34">
        <h1>Recipe Book</h1>
      </div>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Switch light or dark mode">
        <svg class="moon"><use href="#i-moon"/></svg>
        <svg class="sun"><use href="#i-sun"/></svg>
      </button>
    </div>
    <label class="search">
      <svg><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="Search your recipes" autocomplete="off" aria-label="Search your recipes">
    </label>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="section-head">
      <h2 id="sectionTitle">All recipes</h2>
      <span class="count" id="countLabel"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="art"><svg><use href="#i-book"/></svg></div>
      <h3 id="emptyTitle">No recipes yet</h3>
      <p id="emptyText">Tap the red plus button to add your first one.</p>
    </div>
    <p class="storage-note" id="storageNote"></p>
  </div>
</main>

<button class="fab" id="fab" type="button" aria-label="Add a recipe"><svg><use href="#i-plus"/></svg></button>

<nav class="tabs" aria-label="Categories">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-tab="all" aria-selected="true"><span class="pill"><svg><use href="#i-all"/></svg></span>All</button>
    <button class="tab" role="tab" data-tab="dessert" aria-selected="false"><span class="pill"><svg><use href="#i-dessert"/></svg></span>Desserts</button>
    <button class="tab" role="tab" data-tab="meal" aria-selected="false"><span class="pill"><svg><use href="#i-meal"/></svg></span>Meals</button>
    <button class="tab" role="tab" data-tab="snack" aria-selected="false"><span class="pill"><svg><use href="#i-snack"/></svg></span>Snacks</button>
  </div>
</nav>

<!-- Recipe view -->
<section class="sheet" id="detailSheet" hidden aria-label="Recipe">
  <div class="sheet-bar"><div class="wrap">
    <button class="icon-btn" id="detailBack" type="button" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <h2 id="detailBarTitle"></h2>
    <button class="btn" id="detailEdit" type="button">Edit</button>
  </div></div>
  <div class="wrap"><div class="detail" id="detailBody"></div></div>
</section>

<!-- Add / edit -->
<section class="sheet" id="editSheet" hidden aria-label="Add a recipe">
  <div class="sheet-bar"><div class="wrap">
    <button class="icon-btn" id="editClose" type="button" aria-label="Close without saving"><svg><use href="#i-x"/></svg></button>
    <h2 id="editTitle">New recipe</h2>
    <button class="btn primary" id="editSave" type="button">Save</button>
  </div></div>
  <div class="wrap">
    <form class="form" id="editForm" novalidate>
      <div class="field">
        <label class="label" for="fName">Recipe name</label>
        <input class="input" id="fName" type="text" placeholder="e.g. Nonna's lasagne" autocomplete="off" maxlength="120">
        <span class="err" id="nameErr" hidden>Give your recipe a name first.</span>
      </div>

      <div class="field">
        <span class="label">Type</span>
        <div class="seg" id="fCat">
          <button type="button" data-v="meal" aria-pressed="true"><svg><use href="#i-meal"/></svg>Meal</button>
          <button type="button" data-v="dessert" aria-pressed="false"><svg><use href="#i-dessert"/></svg>Dessert</button>
          <button type="button" data-v="snack" aria-pressed="false"><svg><use href="#i-snack"/></svg>Snack</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Cover photo <em>(optional)</em></span>
        <label class="picker file-label" id="coverPicker">
          <div class="inner"><svg><use href="#i-photo"/></svg>Add a cover photo</div>
          <input id="fCover" type="file" accept="image/*" aria-label="Choose a cover photo">
        </label>
        <div class="picker-row" id="coverActions" hidden>
          <label class="btn file-label">Change photo<input id="fCover2" type="file" accept="image/*" aria-label="Change cover photo"></label>
          <button class="btn danger" type="button" id="coverRemove">Remove</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="fIngr">Ingredients <em>(optional, one per line)</em></label>
        <textarea class="input" id="fIngr" placeholder="2 cups plain flour&#10;3 eggs&#10;250 ml milk"></textarea>
      </div>

      <div class="field">
        <span class="label">How to make it</span>
        <div class="seg" id="fMethod">
          <button type="button" data-v="steps" aria-pressed="true"><svg><use href="#i-list"/></svg>Write steps</button>
          <button type="button" data-v="video" aria-pressed="false"><svg><use href="#i-video"/></svg>Video</button>
        </div>
      </div>

      <div class="field" id="stepsPanel">
        <div class="steps-edit" id="stepsEdit"></div>
        <div><button class="btn" type="button" id="addStep"><svg><use href="#i-plus"/></svg>Add a step</button></div>
      </div>

      <div class="field" id="videoPanel" hidden>
        <div id="videoPreview"></div>
        <div class="picker-row">
          <label class="btn primary file-label" id="videoPickBtn"><svg><use href="#i-video"/></svg><span id="videoPickLabel">Choose from camera roll</span><input id="fVideo" type="file" accept="video/*" aria-label="Choose a video from your camera roll"></label>
          <button class="btn danger" type="button" id="videoRemove" hidden>Remove video</button>
        </div>
        <div class="or">or</div>
        <label class="label" for="fLink">Link to a video online <em>(YouTube, TikTok, Instagram)</em></label>
        <input class="input" id="fLink" type="url" inputmode="url" placeholder="https://" autocomplete="off">
      </div>

      <div id="deleteRow" hidden>
        <button class="btn danger" type="button" id="deleteBtn">Delete recipe</button>
      </div>
    </form>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const CATS = { meal: "Meal", dessert: "Dessert", snack: "Snack" };
  const TAB_TITLES = { all: "All recipes", dessert: "Desserts", meal: "Meals", snack: "Snacks" };
  const MAX_CLOUD_BYTES = 20 * 1024 * 1024;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const icon = (n) => `<svg><use href="#i-${n}"/></svg>`;

  let recipes = [];
  let tab = "all";
  let query = "";
  let mode = "starting"; // "cloud" | "local"
  let db = null, assets = null;
  let openId = null;

  /* ---------- Theme ---------- */
  function currentDark() {
    const t = document.documentElement.dataset.theme;
    if (t === "dark") return true;
    if (t === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintTheme() { document.body.classList.toggle("is-dark", currentDark()); }
  try { const saved = localStorage.getItem("rb-theme"); if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved; } catch (e) {}
  paintTheme();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintTheme);
  $("themeBtn").addEventListener("click", () => {
    const next = currentDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("rb-theme", next); } catch (e) {}
    paintTheme();
  });

  /* ---------- Phone storage (IndexedDB) ---------- */
  let idbP = null;
  function idb() {
    if (!idbP) idbP = new Promise((res, rej) => {
      const r = indexedDB.open("recipe-book", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("recipes", { keyPath: "id" }); d.createObjectStore("media"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return idbP;
  }
  function tx(store, txMode, fn) {
    return idb().then((d) => new Promise((res, rej) => {
      const t = d.transaction(store, txMode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }

  /* ---------- Media ---------- */
  async function storeMedia(blob) {
    if (assets && blob.size <= MAX_CLOUD_BYTES) {
      try {
        const r = await assets.upload(blob);
        return { src: "asset", id: r.id, type: blob.type || r.contentType };
      } catch (e) { console.warn("Upload failed, keeping on this device", e); }
    }
    const key = "m_" + uid();
    await tx("media", "readwrite", (s) => s.put(blob, key));
    try { navigator.storage?.persist?.(); } catch (e) {}
    return { src: "device", key, type: blob.type, size: blob.size };
  }
  const urlCache = {};
  async function mediaURL(ref) {
    if (!ref) return null;
    if (ref.src === "asset") return "/_blob/" + ref.id;
    if (ref.src === "device") {
      if (urlCache[ref.key]) return urlCache[ref.key];
      try {
        const b = await tx("media", "readonly", (s) => s.get(ref.key));
        if (!b) return null;
        return (urlCache[ref.key] = URL.createObjectURL(b));
      } catch (e) { return null; }
    }
    return null;
  }
  async function dropMedia(ref) {
    if (!ref) return;
    try {
      if (ref.src === "asset" && assets) await assets.delete(ref.id);
      if (ref.src === "device") await tx("media", "readwrite", (s) => s.delete(ref.key));
    } catch (e) { console.warn("Could not remove old file", e); }
  }
  function shrinkImage(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1400;
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob((b) => resolve(b || file), "image/jpeg", 0.84);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /* ---------- Recipes store ---------- */
  function sortRecipes() { recipes.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); }
  async function loadLocal() {
    try { recipes = (await tx("recipes", "readonly", (s) => s.getAll())) || []; } catch (e) { recipes = []; }
    sortRecipes(); render();
  }
  async function saveRecipe(r) {
    const clean = JSON.parse(JSON.stringify(r));
    if (mode === "cloud") {
      const { id, ...data } = clean;
      await db.collection("recipes").doc(id).set(data);
      const i = recipes.findIndex((x) => x.id === id);
      if (i >= 0) recipes[i] = clean; else recipes.push(clean);
      sortRecipes(); render();
    } else {
      await tx("recipes", "readwrite", (s) => s.put(clean));
      await loadLocal();
    }
  }
  async function deleteRecipe(r) {
    if (mode === "cloud") {
      await db.collection("recipes").doc(r.id).delete();
      recipes = recipes.filter((x) => x.id !== r.id); render();
    } else {
      await tx("recipes", "readwrite", (s) => s.delete(r.id));
      await loadLocal();
    }
    dropMedia(r.cover); dropMedia(r.video);
  }

  function withTimeout(p, ms) { return Promise.race([p, new Promise((res) => setTimeout(() => res(null), ms))]); }

  async function start() {
    render();
    if (window.claude && typeof window.claude.use === "function") {
      try {
        [db, assets] = await Promise.all([
          withTimeout(window.claude.use("db"), 10000).catch(() => null),
          withTimeout(window.claude.use("assets"), 10000).catch(() => null),
        ]);
      } catch (e) { db = null; assets = null; }
    }
    if (db) {
      mode = "cloud";
      let got = false;
      const timer = setTimeout(() => { if (!got) { mode = "local"; db = null; loadLocal(); } }, 10000);
      db.collection("recipes").onSnapshot((snap) => {
        got = true; clearTimeout(timer);
        if (mode !== "cloud") return;
        recipes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        sortRecipes(); render();
        if (openId) { const r = recipes.find((x) => x.id === openId); if (r && !$("detailSheet").hidden) showDetail(r); }
      }, (err) => {
        console.warn("Saved recipes unavailable, using this device", err);
        clearTimeout(timer); mode = "local"; db = null; loadLocal();
      });
    } else {
      mode = "local";
      await loadLocal();
    }
  }

  /* ---------- List ---------- */
  function filtered() {
    const q = query.trim().toLowerCase();
    return recipes.filter((r) => (tab === "all" || r.category === tab) &&
      (!q || (r.title || "").toLowerCase().includes(q) || (r.ingredients || "").toLowerCase().includes(q)));
  }
  function metaLine(r) {
    const parts = [CATS[r.category] || "Recipe"];
    if (r.method === "video" && (r.video || r.videoLink)) parts.push("Video");
    else if (r.steps?.length) parts.push(r.steps.length + (r.steps.length === 1 ? " step" : " steps"));
    return parts.join(" · ");
  }
  function coverHTML(r, cls) {
    const hasVideo = r.method === "video" && (r.video || r.videoLink);
    return `<div class="${cls} ph" data-cover="${esc(r.id)}">${icon(r.category || "meal")}
      ${r.example ? '<span class="badge">Example</span>' : ""}
      ${hasVideo && cls === "cover" ? `<span class="play">${icon("play")}</span>` : ""}</div>`;
  }
  async function hydrateCovers(root) {
    root.querySelectorAll("[data-cover]").forEach(async (el) => {
      const r = recipes.find((x) => x.id === el.dataset.cover);
      if (!r || !r.cover) return;
      const url = await mediaURL(r.cover);
      if (url && el.isConnected) {
        el.style.backgroundImage = `url("${url}")`;
        el.classList.remove("ph");
        el.querySelector(":scope > svg")?.remove();
      }
    });
  }
  function render() {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
    $("sectionTitle").textContent = TAB_TITLES[tab];
    const list = filtered();
    $("countLabel").textContent = mode === "starting" ? "Loading…" : list.length + (list.length === 1 ? " recipe" : " recipes");
    const grid = $("grid");
    grid.innerHTML = list.map((r) => `
      <button class="card" type="button" data-id="${esc(r.id)}">
        ${coverHTML(r, "cover")}
        <span class="card-title">${esc(r.title)}</span>
        <span class="card-meta">${esc(metaLine(r))}</span>
      </button>`).join("");
    hydrateCovers(grid);
    const empty = $("empty");
    empty.hidden = mode === "starting" || list.length > 0;
    if (query.trim()) {
      $("emptyTitle").textContent = "Nothing matches that";
      $("emptyText").textContent = "Try a different word, or check another tab.";
    } else if (tab === "all") {
      $("emptyTitle").textContent = "No recipes yet";
      $("emptyText").textContent = "Tap the red plus button to add your first one.";
    } else {
      $("emptyTitle").textContent = "No " + TAB_TITLES[tab].toLowerCase() + " yet";
      $("emptyText").textContent = "Tap the plus button to add one. It will show up here.";
    }
    $("storageNote").textContent = mode === "cloud"
      ? "Your recipes are saved to your account."
      : mode === "local" ? "Your recipes are saved on this device." : "";
  }
  $("grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card"); if (!card) return;
    const r = recipes.find((x) => x.id === card.dataset.id); if (r) showDetail(r);
  });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); }));
  $("searchInput").addEventListener("input", (e) => { query = e.target.value; render(); });

  /* ---------- Detail ---------- */
  function lockScroll(on) { document.documentElement.style.overflow = on ? "hidden" : ""; }
  function prettyHost(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  async function showDetail(r) {
    openId = r.id;
    $("detailBarTitle").textContent = r.title;
    const ingr = (r.ingredients || "").split("\n").map((s) => s.trim()).filter(Boolean);
    let method = "";
    if (r.method === "video") {
      if (r.video) method += `<div id="videoSlot"><div class="note">Loading video…</div></div>`;
      if (r.videoLink) method += `<a class="link-out" href="${esc(r.videoLink)}" target="_blank" rel="noopener noreferrer">
          <span class="play">${icon("play")}</span><span>Watch the video online<small>${esc(prettyHost(r.videoLink))}</small></span></a>`;
      if (!method) method = `<p class="note">No video added yet. Tap Edit to add one.</p>`;
    } else {
      method = r.steps?.length
        ? `<ol class="steps">${r.steps.map((s) => `<li><p>${esc(s)}</p></li>`).join("")}</ol>`
        : `<p class="note">No steps written yet. Tap Edit to add some.</p>`;
    }
    $("detailBody").innerHTML = `
      ${coverHTML(r, "hero")}
      <div class="chips"><span class="chip">${esc(CATS[r.category] || "Recipe")}</span>${r.example ? '<span class="chip quiet">Example recipe</span>' : ""}</div>
      <h1>${esc(r.title)}</h1>
      ${ingr.length ? `<div class="block"><h3>Ingredients</h3><ul class="ingredients">${ingr.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      <div class="block"><h3>${r.method === "video" ? "Video" : "Method"}</h3>${method}</div>`;
    hydrateCovers($("detailBody"));
    $("detailSheet").hidden = false; lockScroll(true);
    if (r.method === "video" && r.video) {
      const url = await mediaURL(r.video);
      const slot = $("videoSlot"); if (!slot) return;
      slot.innerHTML = url
        ? `<video class="player" controls playsinline preload="metadata" src="${esc(url)}"></video>`
        : `<p class="note">This video was saved on the phone it was added from, so it only plays there.</p>`;
    }
  }
  function closeDetail() {
    $("detailSheet").hidden = true; lockScroll(false); openId = null;
    $("detailBody").querySelectorAll("video").forEach((v) => v.pause());
  }
  $("detailBack").addEventListener("click", closeDetail);
  $("detailEdit").addEventListener("click", () => {
    const r = recipes.find((x) => x.id === openId); if (!r) return;
    closeDetail(); openEditor(r);
  });

  /* ---------- Editor ---------- */
  let draft = null; // working copy
  let pendingCover = null; // Blob or "remove"
  let pendingVideo = null; // File or "remove"
  let tempURLs = [];

  function setSeg(id, v) { $(id).querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v))); }
  function segValue(id) { return $(id).querySelector('[aria-pressed="true"]').dataset.v; }
  $("fCat").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setSeg("fCat", b.dataset.v); });
  $("fMethod").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { setSeg("fMethod", b.dataset.v); syncMethod(); } });
  function syncMethod() {
    const v = segValue("fMethod");
    $("stepsPanel").hidden = v !== "steps";
    $("videoPanel").hidden = v !== "video";
  }

  function stepRow(text) {
    const row = document.createElement("div");
    row.className = "step-row";
    row.innerHTML = `<span class="step-num"></span>
      <textarea class="input" rows="2" placeholder="Describe this step"></textarea>
      <button type="button" class="step-x" aria-label="Remove this step">${icon("x")}</button>`;
    row.querySelector("textarea").value = text || "";
    row.querySelector(".step-x").addEventListener("click", () => {
      row.remove();
      if (!$("stepsEdit").children.length) $("stepsEdit").append(stepRow(""));
      renumber();
    });
    return row;
  }
  function renumber() { [...$("stepsEdit").children].forEach((r, i) => { r.querySelector(".step-num").textContent = i + 1; r.querySelector("textarea").id = "fStep" + (i + 1); }); }
  $("addStep").addEventListener("click", () => {
    const row = stepRow(""); $("stepsEdit").append(row); renumber(); row.querySelector("textarea").focus();
  });

  function tempURL(blob) { const u = URL.createObjectURL(blob); tempURLs.push(u); return u; }
  async function paintCover() {
    const p = $("coverPicker");
    let url = null;
    if (pendingCover instanceof Blob) url = tempURL(pendingCover);
    else if (pendingCover !== "remove" && draft.cover) url = await mediaURL(draft.cover);
    p.style.backgroundImage = url ? `url("${url}")` : "";
    p.classList.toggle("has", !!url);
    $("coverActions").hidden = !url;
  }
  function sizeLabel(n) { return n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(0) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  async function paintVideo() {
    const box = $("videoPreview");
    let url = null, note = "";
    if (pendingVideo instanceof Blob) {
      url = tempURL(pendingVideo);
      if (mode === "cloud" && pendingVideo.size > MAX_CLOUD_BYTES) note = `This video is ${sizeLabel(pendingVideo.size)}, which is too big to save to your account, so it will be kept on this phone only.`;
    } else if (pendingVideo !== "remove" && draft.video) {
      url = await mediaURL(draft.video);
      if (!url) note = "This video was saved on another phone, so it can't play here.";
    }
    box.innerHTML = (url ? `<video class="player" controls playsinline preload="metadata" src="${esc(url)}"></video>` : "") +
      (note ? `<p class="note">${esc(note)}</p>` : "");
    const has = !!url || (pendingVideo !== "remove" && !!draft.video);
    $("videoRemove").hidden = !has;
    $("videoPickLabel").textContent = has ? "Choose a different video" : "Choose from camera roll";
  }

  function openEditor(r) {
    const isNew = !r;
    draft = r ? JSON.parse(JSON.stringify(r)) : {
      id: uid(), title: "", category: tab === "all" ? "meal" : tab, ingredients: "",
      method: "steps", steps: [], video: null, videoLink: "", cover: null, createdAt: Date.now(),
    };
    pendingCover = null; pendingVideo = null;
    $("editTitle").textContent = isNew ? "New recipe" : "Edit recipe";
    $("fName").value = draft.title || "";
    $("nameErr").hidden = true;
    setSeg("fCat", draft.category || "meal");
    setSeg("fMethod", draft.method || "steps");
    $("fIngr").value = draft.ingredients || "";
    $("fLink").value = draft.videoLink || "";
    $("stepsEdit").innerHTML = "";
    (draft.steps?.length ? draft.steps : ["", ""]).forEach((s) => $("stepsEdit").append(stepRow(s)));
    renumber();
    $("deleteRow").hidden = isNew;
    disarmDelete();
    syncMethod(); paintCover(); paintVideo();
    $("editSave").disabled = false; $("editSave").textContent = "Save";
    $("editSheet").hidden = false; $("editSheet").scrollTop = 0; lockScroll(true);
    if (isNew) setTimeout(() => $("fName").focus({ preventScroll: true }), 60);
  }
  function closeEditor() {
    $("editSheet").hidden = true; lockScroll(false);
    $("videoPreview").querySelectorAll("video").forEach((v) => v.pause());
    tempURLs.forEach((u) => URL.revokeObjectURL(u)); tempURLs = [];
    ["fCover", "fCover2", "fVideo"].forEach((id) => { $(id).value = ""; });
  }
  $("fab").addEventListener("click", () => openEditor(null));
  $("editClose").addEventListener("click", closeEditor);

  async function onCoverPicked(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    pendingCover = await shrinkImage(f); e.target.value = ""; paintCover();
  }
  $("fCover").addEventListener("change", onCoverPicked);
  $("fCover2").addEventListener("change", onCoverPicked);
  $("coverRemove").addEventListener("click", () => { pendingCover = "remove"; paintCover(); });
  $("fVideo").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    pendingVideo = f; e.target.value = ""; paintVideo();
  });
  $("videoRemove").addEventListener("click", () => { pendingVideo = "remove"; paintVideo(); });

  let armTimer = null;
  function disarmDelete() { const b = $("deleteBtn"); b.classList.remove("armed"); b.textContent = "Delete recipe"; clearTimeout(armTimer); }
  $("deleteBtn").addEventListener("click", async () => {
    const b = $("deleteBtn");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Tap again to delete for good";
      armTimer = setTimeout(disarmDelete, 4000); return;
    }
    const r = recipes.find((x) => x.id === draft.id) || draft;
    try { await deleteRecipe(r); closeEditor(); toast("Recipe deleted"); }
    catch (err) { console.error(err); toast("Couldn't delete that. Check your connection and try again."); }
  });

  $("editForm").addEventListener("submit", (e) => { e.preventDefault(); save(); });
  $("editSave").addEventListener("click", save);

  async function save() {
    const title = $("fName").value.trim();
    if (!title) { $("nameErr").hidden = false; $("fName").focus(); return; }
    const btn = $("editSave"); btn.disabled = true;
    const old = recipes.find((x) => x.id === draft.id);
    try {
      draft.title = title;
      draft.category = segValue("fCat");
      draft.method = segValue("fMethod");
      draft.ingredients = $("fIngr").value.trim();
      draft.steps = [...$("stepsEdit").querySelectorAll("textarea")].map((t) => t.value.trim()).filter(Boolean);
      let link = $("fLink").value.trim();
      if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
      draft.videoLink = link;
      delete draft.example;

      if (pendingCover instanceof Blob) { btn.textContent = "Saving photo…"; draft.cover = await storeMedia(pendingCover); }
      else if (pendingCover === "remove") draft.cover = null;
      if (pendingVideo instanceof Blob) { btn.textContent = "Saving video…"; draft.video = await storeMedia(pendingVideo); }
      else if (pendingVideo === "remove") draft.video = null;

      btn.textContent = "Saving…";
      await saveRecipe(draft);
      if (old) {
        if (old.cover && JSON.stringify(old.cover) !== JSON.stringify(draft.cover)) dropMedia(old.cover);
        if (old.video && JSON.stringify(old.video) !== JSON.stringify(draft.video)) dropMedia(old.video);
      }
      const saved = recipes.find((x) => x.id === draft.id) || draft;
      if (draft.category !== tab && tab !== "all") { tab = draft.category; render(); }
      closeEditor();
      toast(old ? "Recipe updated" : "Recipe saved");
      showDetail(saved);
    } catch (err) {
      console.error(err);
      btn.disabled = false; btn.textContent = "Save";
      toast("Couldn't save that. Check your connection and try again.");
    }
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("editSheet").hidden) closeEditor(); else if (!$("detailSheet").hidden) closeDetail();
  });

  start();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
})();
</script>
</body>
</html>
